<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wie gut kennst du Anja? 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #D94820;
      --red-dark: #b03a18;
      --cream: #F5F0E6;
      --cream-dark: #EDE8DC;
      --text: #2a2218;
      --green: #4CAF50;
      --wrong: #c0392b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--cream-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      flex-direction: column;
      background: var(--cream);
    }
    .screen.active { display: flex; }

    /* ────────────────────────────────────────
       START SCREEN
    ──────────────────────────────────────── */
    #start {
      align-items: center;
      justify-content: center;
      padding: 40px 28px;
      text-align: center;
      gap: 0;
    }

    .start-label {
      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .start-title {
      font-family: 'Boogaloo', cursive;
      font-size: 72px;
      color: var(--red);
      line-height: 0.9;
      margin-bottom: 6px;
    }

    .start-sub {
      font-family: 'Boogaloo', cursive;
      font-size: 22px;
      color: var(--red);
      margin-bottom: 32px;
    }

    /* hands illustration */
    .start-illustration {
      width: 100%;
      background: var(--cream-dark);
      margin-bottom: 32px;
    }

    .start-desc {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: 32px;
      max-width: 340px;
    }

    .start-desc strong {
      color: var(--red);
    }

    .btn-primary {
      background: var(--red);
      color: var(--cream);
      font-family: 'Boogaloo', cursive;
      font-size: 26px;
      letter-spacing: 2px;
      border: none;
      padding: 16px 48px;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.15s, transform 0.1s;
      text-transform: uppercase;
    }
    .btn-primary:active { background: var(--red-dark); transform: scale(0.97); }

    /* ────────────────────────────────────────
       QUIZ SCREEN
    ──────────────────────────────────────── */
    #quiz { padding: 0; justify-content: flex-start; }

    /* top bar */
    .quiz-top {
      background: var(--red);
      padding: 14px 20px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .q-counter {
      font-family: 'Boogaloo', cursive;
      font-size: 18px;
      color: var(--cream);
      letter-spacing: 1px;
    }

    .score-display {
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: rgba(245,240,230,0.8);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* timer bar */
    .timer-wrap {
      height: 6px;
      background: rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .timer-bar {
      height: 100%;
      background: var(--cream);
      width: 100%;
      transition: width 0.1s linear;
    }
    .timer-bar.urgent { background: #ffd54f; }

    /* question area */
    .question-area {
      padding: 28px 24px 20px;
      flex-shrink: 0;
    }

    .question-emoji {
      font-size: 36px;
      margin-bottom: 10px;
      display: block;
    }

    .question-text {
      font-family: 'Lato', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
    }

    /* answers */
    .answers {
      padding: 0 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .answer-btn {
      background: white;
      border: 2px solid #ddd4c4;
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 16px 20px;
      text-align: left;
      cursor: pointer;
      border-radius: 2px;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      line-height: 1.35;
      min-height: 56px;
    }
    .answer-btn:active:not(:disabled) { transform: scale(0.98); }

    .answer-btn.selected-correct {
      background: #e8f5e9;
      border-color: var(--green);
      color: #1b5e20;
      font-weight: 700;
    }
    .answer-btn.selected-wrong {
      background: #ffebee;
      border-color: var(--wrong);
      color: var(--wrong);
      font-weight: 700;
      text-decoration: line-through;
    }
    .answer-btn.reveal-correct {
      background: #e8f5e9;
      border-color: var(--green);
      color: #1b5e20;
      font-weight: 700;
    }
    .answer-btn:disabled { cursor: default; }

    /* feedback */
    .feedback-bar {
      margin: 0 16px 16px;
      padding: 12px 16px;
      border-radius: 2px;
      font-size: 14px;
      font-weight: 700;
      display: none;
    }
    .feedback-bar.correct {
      background: #e8f5e9;
      color: #2e7d32;
      display: block;
    }
    .feedback-bar.wrong {
      background: #ffebee;
      color: var(--wrong);
      display: block;
    }

    /* progress dots */
    .progress-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 0 16px 20px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ddd4c4;
      flex-shrink: 0;
    }
    .dot.done-correct { background: var(--green); }
    .dot.done-wrong { background: var(--wrong); }
    .dot.current { background: var(--red); }

    /* ────────────────────────────────────────
       RESULT SCREEN
    ──────────────────────────────────────── */
    #result {
      align-items: center;
      justify-content: center;
      padding: 40px 28px;
      text-align: center;
      gap: 0;
    }

    .result-label {
      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .result-score {
      font-family: 'Boogaloo', cursive;
      font-size: 88px;
      color: var(--red);
      line-height: 1;
      margin-bottom: 4px;
    }

    .result-outof {
      font-family: 'Boogaloo', cursive;
      font-size: 22px;
      color: var(--red);
      opacity: 0.7;
      margin-bottom: 24px;
    }

    .result-border {
      border: 1.5px solid var(--red);
      padding: 18px 22px;
      margin-bottom: 28px;
      width: 100%;
      max-width: 340px;
    }

    .result-message {
      font-family: 'Lato', sans-serif;
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
    }

    .result-share {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
      font-style: italic;
    }

    .screenshot-hint {
      background: var(--red);
      color: var(--cream);
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      padding: 14px 20px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 340px;
      line-height: 1.5;
    }

    .screenshot-hint span {
      font-size: 22px;
      display: block;
      margin-bottom: 4px;
    }

    .btn-secondary {
      background: transparent;
      color: var(--red);
      font-family: 'Boogaloo', cursive;
      font-size: 20px;
      letter-spacing: 2px;
      border: 2px solid var(--red);
      padding: 12px 36px;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.15s, color 0.15s;
      text-transform: uppercase;
    }
    .btn-secondary:active { background: var(--red); color: var(--cream); }

    /* confetti */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      opacity: 0;
      animation: fall linear forwards;
    }
    @keyframes fall {
      0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
    }

    /* transition between questions */
    .fade-out { animation: fadeOut 0.2s ease forwards; }
    .fade-in  { animation: fadeIn  0.2s ease forwards; }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-8px); } }
    @keyframes fadeIn  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<!-- ═══════════════════════════════

═══════════════════════════════ -->
<div id="quiz" class="screen">
  <div class="quiz-top">
    <div class="q-counter" id="q-counter">Frage 1 / 12</div>
    <div class="score-display" id="score-display">0 Punkte</div>
  </div>

═══════════════════════════════ -->

  <div class="result-score" id="result-score">0</div>

  <div class="result-border">

<script>
  const questions = [
    {
      emoji: "💪",
      question: "Was machte Anja nach der Geburt ihres ersten Kindes?",
      answers: ["Lange Elternzeit", "Umzug ins Ausland", "Neues Studium begonnen", "Schnell zurück in den Dienst"],

    {
      emoji: "🍷",
      question: "In welcher Stadt erlebten Anja & Daggi ein legendäres Wochenende?",
      answers: ["München", "Köln", "Trier", "Berlin"],
      correct: 2,

    },
    {

    {

      correct: 3,

    {

    {

      question: "Welche Haarfarbe hatte Anja, bevor sie grau wurde?",
      answers: ["Braun", "Hell-Blond", "Schwarz", "Straßenköterblond"],
      correct: 3,
      funfact: "Straßenköterblond! Eine sehr präzise Eigendiagnose. 😄"
    },
  ];

  const messages = [
    { min: 14, max: 14, text: "🏆 PERFEKT! Du kennst Anja besser als sie sich selbst! Sherlock Holmes hätte das nicht besser gemacht." },
    { min: 11, max: 13, text: "🌟 Ausgezeichnet! Du warst eindeutig öfter beim Kaffeeklatsch dabei. Fast perfekt!" },
    { min: 7,  max: 9,  text: "👏 Sehr gut! Du kennst Anjas Leben schon ziemlich gut — aber ein paar Geheimnisse hat sie noch." },
    { min: 4,  max: 6,  text: "😄 Solide! Du kennst Anja, aber heute Abend wirst du noch einiges über sie lernen!" },
    { min: 0,  max: 3,  text: "😂 Na ja... Aber gut, dass du heute hier bist! Anja freut sich trotzdem riesig über dich!" }
  ];

  let currentQ = 0;
  let score = 0;
  let answered = false;
  let timerInterval = null;
  let timeLeft = 20;
  const TIMER_DURATION = 20;
  let dotStates = [];

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function startQuiz() {
    currentQ = 0;
    score = 0;
    dotStates = new Array(questions.length).fill('pending');
    showScreen('quiz');
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    timeLeft = TIMER_DURATION;

    const q = questions[currentQ];

    // counter & score
    document.getElementById('q-counter').textContent = `Frage ${currentQ + 1} / ${questions.length}`;
    document.getElementById('score-display').textContent = `${score} Punkt${score !== 1 ? 'e' : ''}`;

    // question
    const qArea = document.getElementById('question-area');
    qArea.classList.remove('fade-in');
    void qArea.offsetWidth;
    qArea.classList.add('fade-in');

    document.getElementById('question-emoji').textContent = q.emoji;
    document.getElementById('question-text').textContent = q.question;

    // answers
    const area = document.getElementById('answers-area');
    area.innerHTML = '';
    area.classList.remove('fade-in');
    void area.offsetWidth;
    area.classList.add('fade-in');

    q.answers.forEach((ans, i) => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = ans;
      btn.onclick = () => handleAnswer(i);
      area.appendChild(btn);
    });

    // feedback
    const fb = document.getElementById('feedback-bar');
    fb.className = 'feedback-bar';
    fb.textContent = '';

    // dots
    renderDots();

    // timer
    clearInterval(timerInterval);
    updateTimerBar(1);
    timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      const ratio = timeLeft / TIMER_DURATION;
      updateTimerBar(ratio);
      const bar = document.getElementById('timer-bar');
      if (timeLeft <= 6) bar.classList.add('urgent');
      else bar.classList.remove('urgent');
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        if (!answered) {
          timeExpired();
        }
      }
    }, 100);
  }

  function updateTimerBar(ratio) {
    const bar = document.getElementById('timer-bar');
    bar.style.width = Math.max(0, ratio * 100) + '%';
  }

  function handleAnswer(idx) {
    if (answered) return;
    answered = true;
    clearInterval(timerInterval);

    const q = questions[currentQ];
    const btns = document.querySelectorAll('.answer-btn');
    btns.forEach(b => b.disabled = true);

    const fb = document.getElementById('feedback-bar');

    if (idx === q.correct) {
      score++;
      btns[idx].classList.add('selected-correct');
      fb.className = 'feedback-bar correct';
      fb.textContent = '✓ Richtig! ' + q.funfact;
      dotStates[currentQ] = 'correct';
    } else {
      btns[idx].classList.add('selected-wrong');
      btns[q.correct].classList.add('reveal-correct');
      fb.className = 'feedback-bar wrong';
      fb.textContent = '✗ Leider falsch. ' + q.funfact;
      dotStates[currentQ] = 'wrong';
    }

    renderDots();
    document.getElementById('score-display').textContent = `${score} Punkt${score !== 1 ? 'e' : ''}`;

    setTimeout(() => nextQuestion(), 2200);
  }

  function timeExpired() {
    answered = true;
    const q = questions[currentQ];
    const btns = document.querySelectorAll('.answer-btn');
    btns.forEach(b => b.disabled = true);
    btns[q.correct].classList.add('reveal-correct');
    const fb = document.getElementById('feedback-bar');
    fb.className = 'feedback-bar wrong';
    fb.textContent = '⏱ Zeit abgelaufen! ' + q.funfact;
    dotStates[currentQ] = 'wrong';
    renderDots();
    setTimeout(() => nextQuestion(), 2200);
  }

  function nextQuestion() {
    currentQ++;
    if (currentQ >= questions.length) {
      showResult();
    } else {
      renderQuestion();
    }
  }

  function renderDots() {
    const container = document.getElementById('progress-dots');
    container.innerHTML = '';
    questions.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot';
      if (i < currentQ) {
        dot.classList.add(dotStates[i] === 'correct' ? 'done-correct' : 'done-wrong');
      } else if (i === currentQ) {
        dot.classList.add('current');
      }
      container.appendChild(dot);
    });
  }

  function showResult() {
    showScreen('result');
    document.getElementById('result-score').textContent = score;

    const msg = messages.find(m => score >= m.min && score <= m.max);
    document.getElementById('result-message').textContent = msg ? msg.text : '';

    // compare text
    const shareTexts = [
      "Vergleich dein Ergebnis mit den anderen — wer kennt Anja am besten?",
      "Sag deinen Tischnachbarn, wie viele du hattest!",
      "Schreib deinen Score auf einen Zettel — am Ende wird verglichen!"
    ];
    document.getElementById('result-share').textContent =
      score >= 10 ? "🎉 " + shareTexts[0] : shareTexts[Math.floor(Math.random() * shareTexts.length)];

    // confetti for good scores
    if (score >= 8) launchConfetti();
  }

  function launchConfetti() {
    const colors = ['#D94820', '#E8A86A', '#7DAE7A', '#F5F0E6', '#ffd54f'];
    for (let i = 0; i < 60; i++) {
      setTimeout(() => {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.width = (6 + Math.random() * 8) + 'px';
        piece.style.height = (6 + Math.random() * 8) + 'px';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        piece.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        piece.style.animationDelay = '0s';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4000);
      }, i * 40);
    }
  }

  function restartQuiz() {
    startQuiz();
  }

  function showStart() {
    clearInterval(timerInterval);
    showScreen('start');
  }
</script>

</body>
</html>
